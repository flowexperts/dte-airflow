[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dte"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "ibis-framework[duckdb]>=9.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "sqlalchemy>=2.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "httpx>=0.27",
]

[tool.hatch.build.targets.wheel]
packages = ["dte"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
