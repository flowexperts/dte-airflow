# DTE as an Airflow 3.3 app (plan 065). One image runs every Airflow component;
# DTE is the plugin (API at /dte, UI at http://localhost:8080/plugin/dte) and the DAG
# factory in ./dags. Run scripts/bootstrap.sh first: it writes .env with fresh
# secrets and the admin password, and compose refuses to start without them.
# Ports bind to 127.0.0.1 only; this stack is for local use, not a server.
x-airflow: &airflow
  build:
    context: .
    dockerfile: Dockerfile.airflow
    target: ${DTE_IMAGE_TARGET:-final}
  image: dte-airflow:dev
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    # Airflow 3.3's cryptography (>=47) bundles an OpenSSL that probes ARM CPU
    # features Docker's VM on Apple Silicon advertises but can't run: `import
    # airflow` dies with SIGILL. 0 = generic code paths; x86 ignores it. Drop
    # it on real ARM servers, where it only costs crypto speed.
    OPENSSL_armcap: "0"
    AIRFLOW__CORE__LOAD_EXAMPLES: "False"
    # A paused DAG queues manual runs forever; DTE's DAGs must run on trigger.
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "False"
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:?run scripts/bootstrap.sh}
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET:?run scripts/bootstrap.sh}
    AIRFLOW__API__SECRET_KEY: ${AIRFLOW_JWT_SECRET:?run scripts/bootstrap.sh}
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: admin:admin
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_PASSWORDS_FILE: /opt/airflow/state/simple_auth_passwords.json
    # New pipelines / schedules become DAGs on the next parse; keep it quick.
    AIRFLOW__DAG_PROCESSOR__REFRESH_INTERVAL: "5"
    AIRFLOW__DAG_PROCESSOR__MIN_FILE_PROCESS_INTERVAL: "5"
    # DTE's own tables live in the `dte` schema of the same database.
    DTE_DATABASE_URL: postgresql+asyncpg://airflow:airflow@postgres/airflow
    DTE_AIRFLOW_URL: http://localhost:8080
    DTE_ARTIFACT_DIR: /var/lib/dte/artifacts
    # Plan 090: where pipeline files live once DTE_PIPELINE_STORE=file.
    # Shared by the api-server (writes) and the dag-processor (reads).
    DTE_PIPELINES_DIR: /var/lib/dte/pipelines
    DTE_ADMIN_PASSWORD: ${DTE_ADMIN_PASSWORD:?run scripts/bootstrap.sh}
  volumes:
    - ./dags:/opt/airflow/dags
    - ./backend/dte:/opt/dte/backend/dte
    - ./backend/sample_data:/opt/dte/backend/sample_data:ro
    - /tmp/dte-samples:/tmp/dte-samples
    - artifacts:/var/lib/dte/artifacts
    - pipelines:/var/lib/dte/pipelines
    - airflow_state:/opt/airflow/state
  depends_on:
    airflow-init:
      condition: service_completed_successfully

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - airflow_pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Migrates Airflow's metadata DB, then DTE's `dte` schema, then seeds the login.
  airflow-init:
    <<: *airflow
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate && dte db upgrade &&
        echo "{\"admin\": \"$${DTE_ADMIN_PASSWORD}\"}" > /opt/airflow/state/simple_auth_passwords.json
    restart: "no"

  airflow-apiserver:
    <<: *airflow
    command: api-server
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8080/api/v2/version"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  airflow-scheduler:
    <<: *airflow
    command: scheduler

  airflow-dag-processor:
    <<: *airflow
    command: dag-processor

  # Demo warehouse — the database the recorded demos read from and write to.
  # Deliberately NOT a schema inside the `postgres` service above: that one
  # holds the control plane (pipelines, runs, alembic_version), and those
  # tables must never show up in the schema picker on camera.
  #
  # One service, four schemas (crm, sales, staging, analytics). That is what
  # makes the multi-join demo possible at all: `_check_single_backend` in
  # dte/compiler/ibis_compiler.py rejects a pipeline whose sources land on
  # different ibis backends, and BackendRegistry keys backends by
  # Connection.id — so two Postgres *connections* can never be joined. Two
  # schemas behind ONE connection can, and the join pushes down.
  postgres-demo:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: demo
      POSTGRES_DB: warehouse
    volumes:
      - demo_pgdata:/var/lib/postgresql/data
      # Runs ONLY on an empty data directory. To reseed:
      #   docker compose rm -sfv postgres-demo && docker volume rm dte_demo_pgdata
      - ./scripts/demo/seed:/docker-entrypoint-initdb.d:ro
    ports:
      # 5433 on the host — 5432 is the control-plane DB.
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demo -d warehouse"]
      interval: 3s
      timeout: 3s
      retries: 20
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 256M

  # Kafka source demo (plan 107), opt-in: `docker compose --profile kafka up -d`.
  # Airflow reaches the broker as kafka:9092, the host as localhost:9094.
  # The JVM flags dodge a SIGILL on Apple Silicon; other CPUs ignore them.
  kafka:
    profiles: [kafka]
    image: apache/kafka:3.9.0
    environment:
      JAVA_TOOL_OPTIONS: -XX:+IgnoreUnrecognizedVMOptions -XX:UseSVE=0
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:9094,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    ports:
      - "127.0.0.1:9094:9094"

  kafka-ui:
    profiles: [kafka]
    image: kafbat/kafka-ui:latest
    environment:
      JAVA_TOOL_OPTIONS: -XX:+IgnoreUnrecognizedVMOptions -XX:UseSVE=0
      KAFKA_CLUSTERS_0_NAME: dte
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    ports:
      - "127.0.0.1:8090:8080"
    depends_on: [kafka]

volumes:
  airflow_pgdata:
  airflow_state:
  # Demo warehouse data. Dropping it is how you reseed — see the
  # postgres-demo service comment.
  demo_pgdata:
  # Content-addressed extract/structure cache.
  artifacts:
  # Pipeline files (plan 090).
  pipelines:
