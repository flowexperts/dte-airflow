services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dte
      POSTGRES_PASSWORD: dte
      POSTGRES_DB: dte
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dte -d dte"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://dte:dte@postgres:5432/dte
      DTE_CORS_ORIGINS: http://localhost:3000
    command: >
      sh -c "ALEMBIC_URL=$$(echo $$DATABASE_URL | sed 's|+asyncpg||') &&
             DATABASE_URL=$$ALEMBIC_URL alembic upgrade head &&
             exec uvicorn dte.api.main:app --host 0.0.0.0 --port 8001 --reload"
    volumes:
      - ./backend/dte:/app/dte
      - ./backend/alembic:/app/alembic
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8001
      INTERNAL_API_URL: http://backend:8001
    command: pnpm dev
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:
