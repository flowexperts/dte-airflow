[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dte-sdk"
version = "0.1.0"
description = "Batch data transformation SDK: define sources, destinations, and pipelines in code; run them with DuckDB + ibis."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.12"
dependencies = [
    "ibis-framework[duckdb]>=9.0",
    "pydantic>=2.7",
    "dlt[duckdb]>=1.4",
    "sqlalchemy[asyncio]>=2.0",
    "sqlmodel>=0.0.22",
]

[project.optional-dependencies]
parquet = ["pyarrow>=15", "fsspec>=2024.6"]
s3 = ["s3fs>=2024.6"]
mongodb = ["pymongo"]
fernet = ["cryptography>=42.0,<43"]
postgres-writer = ["dlt[postgres]>=1.4", "psycopg[binary]>=3.1"]
mysql-writer = ["dlt[mysql]>=1.4"]
snowflake-writer = ["dlt[snowflake]>=1.4"]
bigquery-writer = ["dlt[bigquery]>=1.4"]
all = [
    "pyarrow>=15",
    "fsspec>=2024.6",
    "s3fs>=2024.6",
    "pymongo",
    "cryptography>=42.0,<43",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "mongomock>=4.1",
    "requests-mock>=1.11",
]

[tool.hatch.build.targets.wheel]
packages = ["src/dte_sdk"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
