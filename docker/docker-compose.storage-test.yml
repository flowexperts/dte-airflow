services:
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 3s
      timeout: 5s
      retries: 10
      start_period: 5s

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:latest
    command: azurite-blob --blobHost 0.0.0.0 --blobPort 10000 --skipApiVersionCheck
    ports:
      - "10000:10000"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:10000/"]
      interval: 3s
      timeout: 5s
      retries: 10
      start_period: 3s

  fake-gcs:
    # Locally built from fsouza/fake-gcs-server PR #2092 ("Support XML API"),
    # which is unmerged and therefore in no published tag. Stock images only
    # implement the JSON upload API, but DuckDB writes via the S3-compatible
    # XML PUT -- so `COPY ... TO 'gcs://...'` fails 400 "invalid uploadType"
    # against them. Reads work on any image; only writes need this build.
    #
    #   git clone -b support-xml-api-fixed \
    #     https://github.com/LarsAlmgren/fake-gcs-server.git
    #   cd fake-gcs-server && docker build -t fake-gcs-server:xml-pr2092 .
    #
    # Swap back to `fsouza/fake-gcs-server:latest` once #2092 lands upstream.
    image: fake-gcs-server:xml-pr2092
    # `publicHostMatcher` demands exact hostname equality (port stripped), so
    # this must match the ENDPOINT clients use -- a mismatch 404s the XML API
    # while the JSON API keeps working, which looks nothing like a config bug.
    #
    # `localhost` serves host-run tooling but is unreachable under that name
    # from another container. To drive the emulator from the Docker backend
    # too, set both of these to this machine's LAN IP, which resolves on the
    # host and is reachable from containers:
    #
    #   export FAKE_GCS_PUBLIC_HOST=$(ipconfig getifaddr en0)     # macOS
    #   export FAKE_GCS_ENDPOINT="http://$FAKE_GCS_PUBLIC_HOST:4443"
    command: -scheme http -port 4443 -public-host ${FAKE_GCS_PUBLIC_HOST:-localhost}
    ports:
      - "4443:4443"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:4443/storage/v1/b"]
      interval: 3s
      timeout: 5s
      retries: 10
      start_period: 3s
