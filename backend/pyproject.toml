[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dte"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "ibis-framework[duckdb]>=9.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "dlt[duckdb]>=1.4",
    "httpx>=0.27",
    "asyncpg>=0.29",
    "sqlalchemy[asyncio]>=2.0",
    "sqlmodel>=0.0.22",
    "alembic>=1.13",
    "cryptography>=42.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "mongomock>=4.1",
    "requests-mock>=1.11",
]
parquet = ["pyarrow>=15", "fsspec>=2024.6"]
s3 = ["s3fs>=2024.6"]
postgres-writer = ["dlt[postgres]>=1.4", "psycopg[binary]>=3.1"]
mysql-writer = ["dlt[mysql]>=1.4"]
snowflake-writer = ["dlt[snowflake]>=1.4"]
bigquery-writer = ["dlt[bigquery]>=1.4"]

[tool.hatch.build.targets.wheel]
packages = ["dte"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
