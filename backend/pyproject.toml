[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
# `dte` is taken on PyPI. The import package and the CLI are still `dte`.
name = "dte-airflow"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    # `mysql` intentionally omitted from core — pulls mysqlclient which needs
    # libmysqlclient at build time (breaks fresh installs on macOS/Docker).
    # Enable with the `mysql-source` extra when needed.
    "ibis-framework[duckdb,postgres,sqlite]>=12.0,<13.0",
    # No ceiling: Airflow 3.3 pins sqlglot 30. dte/__init__.py adapts ibis
    # to it (plan 073).
    "sqlglot>=23.4",
    # duckdb 2 dropped `fetch_arrow_table`, which ibis 12's duckdb backend
    # calls on every execute. The lockfile hides this; a plain `pip install
    # dte-airflow` doesn't (plan 073). Lift with the ibis upgrade.
    "duckdb>=1.1,<2",
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.4,<3.0",
    "dlt[duckdb]>=1.4,<2.0",
    "httpx>=0.27,<1.0",
    # MongoDB sources (dte.sources.loader / pools.mongo).
    "pymongo>=4.6,<5.0",
    "asyncpg>=0.29,<1.0",
    "sqlalchemy[asyncio]>=2.0,<3.0",
    "sqlmodel>=0.0.22,<0.1",
    "alembic>=1.13,<2.0",
    # Eval date comparators. Available transitively via pandas, but declared
    # explicitly because dte.evals imports it directly.
    "python-dateutil>=2.8,<3.0",
    "python-multipart>=0.0.9,<1.0",
    "opentelemetry-api>=1.27,<2.0",
    "opentelemetry-sdk>=1.27,<2.0",
    "prometheus-client>=0.20,<1.0",
    "croniter>=2.0,<7.0",
    # http_lookup field paths (plan 085). No pin: Airflow's constraints own it.
    "jmespath",
]

[project.scripts]
dte = "dte.cli:main"

[project.entry-points.apache_airflow_provider]
provider_info = "dte.airflow.provider:get_provider_info"

[project.entry-points."airflow.plugins"]
dte = "dte.airflow.plugin:DtePlugin"

[project.optional-dependencies]
# Airflow 3.3 app (plan 065; 3.3 for plugin nav menus, plan 067). Inside the apache/airflow image Airflow is
# already installed; this pins the range for anyone installing outside it.
# The anthropic/openai providers own the model-key connections (plan 072).
# No ceilings (plan 073): with Airflow's constraints pip picks the provider
# release that fits the pinned common-compat.
airflow = [
    "apache-airflow>=3.3",
    "apache-airflow-providers-anthropic>=1.1",
    "apache-airflow-providers-openai>=1.8",
]
# Document extraction (plan 050). Kept out of core so a deployment that never
# touches PDFs doesn't carry the dependency; dte.providers imports lazily and
# reports a message naming this extra when it's absent.
# Install with: pip install "dte[unstructured]"
unstructured = [
    "pypdf>=5.0,<7.0",
    "pdfplumber>=0.11,<1.0",
]
# Model-backed `structure` providers (plan 050). Separate from `unstructured`
# on purpose: the regex provider needs neither SDK, and a deployment that only
# uses it should not carry them.
# Install with: pip install "dte[models]"
models = [
    # The providers own the model-key connections (plan 072) and bring the SDKs.
    "apache-airflow-providers-anthropic>=1.1",
    "apache-airflow-providers-openai>=1.8",
]
dev = [
    "pypdf>=5.0,<7.0",
    "pdfplumber>=0.11,<1.0",
    "anthropic>=1.0,<2.0",
    "openai>=1.50,<3.0",
    "pytest>=8.0,<9.0",
    "pytest-asyncio>=0.23,<1.0",
    "pytest-cov>=5.0,<7.0",
    "httpx>=0.27,<1.0",
    "mongomock>=4.1,<5.0",
    "requests-mock>=1.11,<2.0",
    "ruff>=0.6,<1.0",
    "hypothesis>=6.100,<7.0",
    "mutmut>=2.5,<4.0",
    "pyarrow>=15",
    # dte.airflow.db builds postgresql+psycopg2:// URLs; Airflow images ship it,
    # a bare dev install (CI) does not.
    "psycopg2-binary>=2.9,<3.0",
]
# No ceilings on packages Airflow's constraints pin (pyarrow, fsspec, s3fs,
# sqlglot): Airflow picks the version, DTE follows (plan 073).
parquet = ["pyarrow>=15", "fsspec>=2024.6"]
# Object storage and SQL auth belong to Airflow's providers (plan 074): these
# extras only name the provider (and the fsspec package its filesystem needs).
amazon = ["apache-airflow-providers-amazon[s3fs]"]
google = ["apache-airflow-providers-google"]
azure = ["apache-airflow-providers-microsoft-azure"]
sftp = ["apache-airflow-providers-sftp", "sshfs"]
mongo = ["apache-airflow-providers-mongo"]
postgres-writer = ["dlt[postgres]>=1.4,<2.0", "psycopg[binary]>=3.1,<4.0"]
# dlt ships no `mysql` extra (`dlt[mysql]` silently resolved to plain dlt).
# pymysql, not mysqlclient: pure Python, so the image needs no C toolchain.
mysql-writer = ["dlt[sqlalchemy]>=1.4,<2.0", "pymysql>=1.1,<2.0"]
snowflake-writer = ["dlt[snowflake]>=1.4,<2.0"]
bigquery-writer = ["dlt[bigquery]>=1.4,<2.0"]
# Trino engine — plan-034 distributed execution seam.
# Install with: pip install "dte[trino]"
trino = ["ibis-framework[trino]>=12.0,<13.0", "trino>=0.329,<1.0"]
# Native ibis backends kept optional to avoid heavy or system-level build
# deps (mysqlclient, google-cloud-bigquery, snowflake-connector-python).
mysql-source = ["ibis-framework[mysql]>=12.0,<13.0"]
# SQL Server, read and write (plan 069). Both sides go through pyodbc, which
# needs Microsoft's ODBC Driver 18 installed on the host (Dockerfile.airflow).
mssql = ["apache-airflow-providers-microsoft-mssql", "ibis-framework[mssql]>=12.0,<13.0", "dlt[mssql]>=1.4,<2.0"]
bigquery-source = ["ibis-framework[bigquery]>=12.0,<13.0"]
snowflake-source = ["ibis-framework[snowflake]>=12.0,<13.0"]

[tool.hatch.build.targets.wheel]
packages = ["dte"]
# The Vite UI bundle (gitignored; the release workflow copies frontend/dist
# here). `artifacts` so a dev build without it still works.
artifacts = ["dte/ui/**"]

# `dte db upgrade` runs these from inside the installed package (plan 073).
[tool.hatch.build.targets.wheel.force-include]
"alembic.ini" = "dte/migrations/alembic.ini"
"alembic" = "dte/migrations/alembic"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Scenario suite is opt-in — it spins up the real API in-process and is
# slower than unit tests. Run explicitly: `pytest tests/scenarios -m scenario`.
# Integration suite requires a live Postgres (DTE_DATABASE_URL). Run explicitly:
# `pytest tests/integration -m integration`.
addopts = "--ignore=tests/scenarios --ignore=tests/integration"
markers = [
    "scenario: per-op end-to-end scenarios that drive the real API in-process (opt-in)",
    "integration: tests that require live external services (Postgres, MinIO, Azurite) (opt-in)",
]

[tool.coverage.run]
source = ["dte"]
omit = [
    "dte/admin/*",           # FastAdmin shim, exercised manually
    "dte/sources/dlt_loader.py",  # deprecated shim, kept one release
]

[tool.coverage.report]
skip_empty = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.mutmut]
paths_to_mutate = "dte/compiler/"
tests_dir = "tests/unit/"
runner = "uv run pytest tests/unit -x -q --no-cov"

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["alembic/versions", ".venv", "worktrees"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = [
    "E501",  # line-length — enforced by black-ish formatting, not linting
    "B008",  # FastAPI Depends() in defaults is idiomatic
    "B904",  # raise-from noise; tackle incrementally
    "E402",  # dte/models/pipeline.py loads dlt specs lazily on purpose
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B", "E402"]
"scripts/**" = ["B", "E402"]
