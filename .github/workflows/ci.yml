name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dte
          POSTGRES_PASSWORD: dte
          POSTGRES_DB: dte
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dte"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    env:
      DTE_DATABASE_URL: postgresql+asyncpg://dte:dte@localhost:5432/dte
      DTE_JWT_SECRET: ci-jwt-secret-do-not-reuse
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install (frozen from uv.lock)
        run: uv sync --frozen --extra dev --extra trino
      - name: Lint (ruff)
        run: uv run ruff check dte
      - name: Migrate
        run: DTE_DATABASE_URL=postgresql://dte:dte@localhost:5432/dte uv run alembic upgrade head
      - name: Unit + compiler tests (with coverage floor)
        run: uv run pytest tests/unit -q --cov=dte --cov-report=term --cov-fail-under=70
      - name: Scenario tests
        run: uv run pytest tests/scenarios -m scenario -q

  integration:
    runs-on: ubuntu-latest
    needs: [backend]
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dte
          POSTGRES_PASSWORD: dte
          POSTGRES_DB: dte
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dte"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    env:
      DTE_DATABASE_URL: postgresql+asyncpg://dte:dte@localhost:5432/dte
      DTE_JWT_SECRET: ci-jwt-secret-do-not-reuse
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install (frozen from uv.lock)
        run: uv sync --frozen --extra dev --extra trino
      - name: Migrate
        run: DTE_DATABASE_URL=postgresql://dte:dte@localhost:5432/dte uv run alembic upgrade head
      - name: Integration tests (Postgres store + RLS enforcement)
        run: uv run pytest tests/integration -m integration -v

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm format:check
