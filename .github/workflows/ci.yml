name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dte
          POSTGRES_PASSWORD: dte
          POSTGRES_DB: dte
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dte"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+asyncpg://dte:dte@localhost:5432/dte
      DTE_JWT_SECRET: ci-jwt-secret-do-not-reuse
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - name: Install
        run: uv venv && uv pip install -e ".[dev]"
      - name: Lint (ruff)
        run: uv run ruff check dte
      - name: Migrate
        run: DATABASE_URL=postgresql://dte:dte@localhost:5432/dte uv run alembic upgrade head
      - name: Unit + compiler tests
        run: uv run pytest tests/unit -q
      - name: Scenario tests
        run: uv run pytest tests/scenarios -m scenario -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm format:check

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - name: Boot stack
        run: docker compose up -d --build
      - name: Wait for backend
        run: |
          for i in {1..40}; do
            curl -sf http://localhost:8001/healthz && break
            sleep 2
          done
      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm test:e2e:install
          pnpm test:e2e
      - name: Dump logs on failure
        if: failure()
        run: docker compose logs backend frontend
