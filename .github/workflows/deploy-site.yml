name: Deploy site

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "docs/user/**"
      - ".github/workflows/deploy-site.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - name: Build (static export)
        env:
          NEXT_PUBLIC_APP_URL: ${{ vars.DTE_APP_URL }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.DTE_SITE_URL }}
        run: pnpm build
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: site
          # main is the Pages production branch; any other branch gets a preview URL.
          command: pages deploy out --project-name=dte-site --branch=${{ github.ref_name }}
