name: Trivy Image Scan

on:
  push:
    branches: [main]
  pull_request:

jobs:
  trivy-dev:
    name: Trivy — dev image (python:3.12-slim runtime)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build backend dev image
        run: docker build -t dte-backend:${{ github.sha }} ./backend

      - name: Scan backend dev image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: dte-backend:${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true

  trivy-prod:
    name: Trivy — prod image (distroless runtime)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build backend prod image (distroless)
        run: docker build -f backend/Dockerfile.prod -t dte-backend-prod:${{ github.sha }} ./backend

      - name: Scan backend prod image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: dte-backend-prod:${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
